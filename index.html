<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1923">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PG Schedule">
<title>PG Staff Schedule</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f1923;
  --surface: #1a2533;
  --surface2: #212f40;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.15);
  --text: #f0f4f8;
  --muted: #7a8fa6;
  --accent: #3b82f6;
  --accent-dim: rgba(59,130,246,0.15);
  --green: #22c55e;
  --green-dim: rgba(34,197,94,0.15);
  --amber: #f59e0b;
  --amber-dim: rgba(245,158,11,0.15);
  --purple: #a78bfa;
  --purple-dim: rgba(167,139,250,0.15);
  --red: #ef4444;
  --red-dim: rgba(239,68,68,0.15);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}

/* Header */
.header{
  padding: calc(var(--safe-top) + 12px) 16px 12px;
  background:var(--bg);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.logo{font-family:'DM Mono',monospace;font-size:16px;font-weight:500;letter-spacing:-0.5px}
.logo span{color:var(--accent)}
.week-nav{display:flex;align-items:center;gap:8px}
.week-nav button{background:var(--surface);border:1px solid var(--border);color:var(--text);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.week-nav button:active{background:var(--surface2)}
.week-label{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);min-width:90px;text-align:center}

/* Tabs */
.tabs{display:flex;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0}
.tab{flex:1;padding:10px 0;font-size:12px;font-weight:500;color:var(--muted);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* Main scroll */
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.view{display:none}
.view.active{display:block}

/* Schedule grid */
.schedule-wrap{padding:12px}
.emp-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.emp-header{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-dim);border:1px solid var(--accent);display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:11px;font-weight:500;color:var(--accent);flex-shrink:0}
.emp-name{font-size:14px;font-weight:500;flex:1}
.emp-stats{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace}
.days-row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:8px}
.day-cell{display:flex;flex-direction:column;align-items:center;gap:3px}
.day-label{font-size:9px;color:var(--muted);font-family:'DM Mono',monospace;text-transform:uppercase}
.day-label.weekend{color:var(--red)}
.shift-btn{width:100%;aspect-ratio:1;border-radius:6px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;font-family:'DM Mono',monospace;transition:all .15s;color:var(--muted)}
.shift-btn.M{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.shift-btn.A{background:var(--green-dim);border-color:var(--green);color:var(--green)}
.shift-btn.N{background:var(--purple-dim);border-color:var(--purple);color:var(--purple)}
.shift-btn.X{background:var(--amber-dim);border-color:var(--amber);color:var(--amber)}
.shift-btn.S{background:var(--red-dim);border-color:var(--red);color:var(--red)}
.shift-btn:active{transform:scale(0.92)}

/* Add employee */
.icon-btn{background:none;border:1px solid var(--border);color:var(--muted);width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn:active{background:var(--surface2)}
.icon-btn.danger{color:var(--red);border-color:var(--red-dim)}
.icon-btn.danger:active{background:var(--red-dim)}
.add-emp-bar{display:flex;gap:8px;padding:0 12px 12px}
.add-emp-bar input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif}
.add-emp-bar input::placeholder{color:var(--muted)}
.add-emp-bar button{background:var(--accent);border:none;color:#fff;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:500;cursor:pointer}
.add-emp-bar button:active{opacity:.8}

/* Legend */
.legend{display:flex;gap:8px;flex-wrap:wrap;padding:0 12px 12px}
.leg{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted);font-family:'DM Mono',monospace}
.leg-dot{width:14px;height:14px;border-radius:3px}

/* AI Chat */
.chat-view{display:flex;flex-direction:column;height:100%}
.chat-msgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:88%;padding:10px 13px;font-size:14px;line-height:1.5;border-radius:16px}
.bubble.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.bubble.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--border);color:var(--text);border-bottom-left-radius:4px}
.bubble.ai b{font-weight:500;color:var(--accent)}
.action-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{padding:6px 12px;border-radius:20px;background:var(--surface2);border:1px solid var(--border2);color:var(--text);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif}
.chip:active{background:var(--accent-dim);border-color:var(--accent)}
.typing-bubble{display:flex;gap:4px;align-items:center}
.typing-bubble span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:pulse 1.2s infinite}
.typing-bubble span:nth-child(2){animation-delay:.2s}
.typing-bubble span:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,80%,100%{opacity:.2}40%{opacity:1}}

.chat-input-area{padding:10px 12px;padding-bottom:calc(10px + var(--safe-bottom));background:var(--bg);border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end;flex-shrink:0}
.chat-input-area textarea{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 13px;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;resize:none;min-height:44px;max-height:120px;line-height:1.4}
.chat-input-area textarea::placeholder{color:var(--muted)}
.send-btn{width:44px;height:44px;border-radius:12px;background:var(--accent);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.send-btn:active{opacity:.8}

/* Stats view */
.stats-view{padding:12px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
.stat-card-title{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.stat-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.stat-row:last-child{border-bottom:none}
.stat-bar-wrap{display:flex;align-items:center;gap:8px;flex:1;margin-left:12px}
.stat-bar{height:4px;border-radius:2px;background:var(--accent);min-width:4px}
.stat-num{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);min-width:24px;text-align:right}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.summary-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px}
.summary-box .val{font-size:28px;font-weight:300;font-family:'DM Mono',monospace;color:var(--accent)}
.summary-box .lbl{font-size:11px;color:var(--muted);margin-top:2px}
</style>
</head>
<body>

<div class="header">
  <div class="logo">PG<span>.</span>schedule</div>
  <div class="week-nav">
    <button onclick="prevW()">‹</button>
    <div class="week-label" id="wlabel"></div>
    <button onclick="nextW()">›</button>
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="showView('schedule',this)">Schedule</button>
  <button class="tab" onclick="showView('ai',this)">AI Assistant</button>
  <button class="tab" onclick="showView('stats',this);renderStats()">Statistics</button>
</div>

<div class="main">

  <!-- SCHEDULE -->
  <div class="view active" id="view-schedule">
    <div class="schedule-wrap" id="sched-wrap"></div>
    <div class="legend">
      <div class="leg"><div class="leg-dot" style="background:#1e3a5f;border:1px solid #3b82f6"></div>M morning</div>
      <div class="leg"><div class="leg-dot" style="background:#14532d;border:1px solid #22c55e"></div>A afternoon</div>
      <div class="leg"><div class="leg-dot" style="background:#3b0764;border:1px solid #a78bfa"></div>N noc</div>
      <div class="leg"><div class="leg-dot" style="background:#451a03;border:1px solid #f59e0b"></div>O off</div>
      <div class="leg"><div class="leg-dot" style="background:#450a0a;border:1px solid #ef4444"></div>SK sick</div>
    </div>
    <div class="add-emp-bar">
      <input type="text" id="new-emp" placeholder="Add employee..." />
      <button onclick="addEmp()">+</button>
    </div>
  </div>

  <!-- AI CHAT -->
  <div class="view" id="view-ai" style="height:calc(100vh - 120px);display:none;flex-direction:column">
    <div class="chat-msgs" id="chat-msgs"></div>
    <div class="chat-input-area">
      <textarea id="chat-in" placeholder="e.g. Smith is sick on Wednesday..." rows="1"
        oninput="autoResize(this)"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"></textarea>
      <button class="send-btn" onclick="sendMsg()">↑</button>
    </div>
  </div>

  <!-- STATS -->
  <div class="view" id="view-stats">
    <div class="stats-view" id="stats-content"></div>
  </div>

</div>

<script>
var SHIFTS = ['','M','A','N','X','S'];
var SLABELS = {'':'–','M':'M','A':'A','N':'N','X':'O','S':'SK'};
var SNAMES = {'M':'morning (6–14)','A':'afternoon (14–22)','N':'night (22–6)','X':'off','S':'sick','':"none"};
var DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

var state = JSON.parse(localStorage.getItem('pg_state') || 'null') || {
  employees: [
    {name:'Jan Kowalski',pref:'M'},
    {name:'Anna Nowak',pref:'A'},
    {name:'Piotr Wiśniewski',pref:'M'},
    {name:'Maria Zielińska',pref:'N'}
  ],
  schedule: {},
  weekOff: 0
};

function save(){localStorage.setItem('pg_state',JSON.stringify(state))}

function getWS(off){
  var d=new Date(),day=d.getDay(),diff=d.getDate()-day+(day===0?-6:1);
  d.setDate(diff+off*7);d.setHours(0,0,0,0);return d;
}
function fd(d){return d.getDate()+'.'+(d.getMonth()+1).toString().padStart(2,'0')}
function ekey(n,di){return state.weekOff+'_'+n+'_'+di}
function prevW(){state.weekOff--;save();render()}
function nextW(){state.weekOff++;save();render()}

function cycleShift(n,di){
  var k=ekey(n,di),cur=state.schedule[k]||'',idx=SHIFTS.indexOf(cur);
  state.schedule[k]=SHIFTS[(idx+1)%SHIFTS.length];
  save();render();
}

function addEmp(){
  var v=document.getElementById('new-emp').value.trim();
  if(!v)return;
  state.employees.push({name:v,pref:'M'});
  document.getElementById('new-emp').value='';
  save();render();
}

function initials(name){return name.split(' ').map(function(w){return w[0]||''}).join('').slice(0,2).toUpperCase()}

function render(){
  var ws=getWS(state.weekOff),we=new Date(ws);we.setDate(ws.getDate()+6);
  document.getElementById('wlabel').textContent=fd(ws)+'–'+fd(we);
  var html='';
  state.employees.forEach(function(emp){
    var count=0;
    for(var d=0;d<7;d++){var s=state.schedule[ekey(emp.name,d)]||'';if(s&&s!=='X'&&s!=='S')count++;}
    var i=state.employees.indexOf(emp);
    html+='<div class="emp-card">';
    html+='<div class="emp-header"><div class="avatar">'+initials(emp.name)+'</div>';
    html+='<div class="emp-name">'+emp.name+'</div>';
    html+='<div class="emp-stats">'+count+'d</div>';
    html+='<button class="icon-btn" onclick="editEmp('+i+')" aria-label="Edit">✎</button>';
    html+='<button class="icon-btn danger" onclick="deleteEmp('+i+')" aria-label="Delete">✕</button>';
    html+='</div>';
    html+='<div class="days-row">';
    for(var d=0;d<7;d++){
      var k=ekey(emp.name,d),s=state.schedule[k]||'';
      var isWe=d>=5;
      html+='<div class="day-cell">';
      html+='<div class="day-label'+(isWe?' weekend':'')+'">'+DAYS[d]+'</div>';
      var safe=emp.name.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      html+='<button class="shift-btn '+s+'" onclick="cycleShift(\''+safe+'\','+d+')">'+SLABELS[s]+'</button>';
      html+='</div>';
    }
    html+='</div></div>';
  });
  document.getElementById('sched-wrap').innerHTML=html;
}

function editEmp(i){
  var emp=state.employees[i];
  var newName=prompt('Edit name:',emp.name);
  if(!newName||!newName.trim())return;
  newName=newName.trim();
  if(newName===emp.name)return;
  // migrate schedule keys
  for(var d=0;d<7;d++){
    var oldKey=ekey(emp.name,d),newKey=state.weekOff+'_'+newName+'_'+d;
    if(state.schedule[oldKey]!==undefined){state.schedule[newKey]=state.schedule[oldKey];delete state.schedule[oldKey];}
  }
  state.employees[i].name=newName;
  save();render();
}

function deleteEmp(i){
  var emp=state.employees[i];
  if(!confirm('Remove '+emp.name+' from the schedule?'))return;
  // clean schedule
  for(var d=0;d<7;d++){delete state.schedule[ekey(emp.name,d)];}
  state.employees.splice(i,1);
  save();render();
}


  document.querySelectorAll('.view').forEach(function(v){v.style.display='none';v.classList.remove('active')});
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  var el=document.getElementById('view-'+id);
  if(id==='ai'){el.style.display='flex'}else{el.style.display='block'}
  el.classList.add('active');
  if(tab)tab.classList.add('active');
}

function renderStats(){
  var ws=getWS(state.weekOff);
  var totals={M:0,A:0,N:0,X:0,S:0,total:0};
  var empData=state.employees.map(function(emp){
    var counts={M:0,A:0,N:0,X:0,S:0};
    for(var d=0;d<7;d++){var s=state.schedule[ekey(emp.name,d)]||'';if(s)counts[s]=(counts[s]||0)+1;}
    var work=counts.M+counts.A+counts.N;
    Object.keys(counts).forEach(function(k){totals[k]=(totals[k]||0)+counts[k]});
    totals.total+=work;
    return {name:emp.name,counts:counts,work:work};
  });
  var maxWork=Math.max.apply(null,empData.map(function(e){return e.work}))||1;
  var html='<div class="summary-grid">';
  html+='<div class="summary-box"><div class="val">'+totals.total+'</div><div class="lbl">shifts this week</div></div>';
  html+='<div class="summary-box"><div class="val" style="color:var(--red)">'+totals.S+'</div><div class="lbl">absences</div></div>';
  html+='<div class="summary-box"><div class="val" style="color:var(--accent)">'+totals.M+'</div><div class="lbl">morning shifts</div></div>';
  html+='<div class="summary-box"><div class="val" style="color:var(--green)">'+totals.A+'</div><div class="lbl">afternoon shifts</div></div>';
  html+='</div>';
  html+='<div class="stat-card"><div class="stat-card-title">Workload per employee</div>';
  empData.sort(function(a,b){return b.work-a.work}).forEach(function(e){
    var pct=Math.round(e.work/maxWork*100);
    html+='<div class="stat-row"><span>'+e.name+'</span><div class="stat-bar-wrap"><div class="stat-bar" style="width:'+pct+'%"></div></div><span class="stat-num">'+e.work+'</span></div>';
  });
  html+='</div>';
  html+='<div class="stat-card"><div class="stat-card-title">Shift distribution</div>';
  [{k:'M',label:'Morning',c:'var(--accent)'},{k:'A',label:'Afternoon',c:'var(--green)'},{k:'N',label:'Night',c:'var(--purple)'},{k:'X',label:'Days off',c:'var(--amber)'},{k:'S',label:'Sick',c:'var(--red)'}].forEach(function(item){
    var pct=totals.total>0?Math.round((totals[item.k]||0)/totals.total*100):0;
    html+='<div class="stat-row"><span>'+item.label+'</span><div class="stat-bar-wrap"><div class="stat-bar" style="width:'+Math.max(pct,2)+'%;background:'+item.c+'"></div></div><span class="stat-num">'+(totals[item.k]||0)+'</span></div>';
  });
  html+='</div>';
  document.getElementById('stats-content').innerHTML=html;
}

function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px'}

var chatHistory=[];
var aiLoading=false;

function addBubble(role,html){
  var msgs=document.getElementById('chat-msgs');
  var div=document.createElement('div');
  div.className='bubble '+role;
  div.innerHTML=html;
  msgs.appendChild(div);
  msgs.scrollTop=msgs.scrollHeight;
  return div;
}

function getCtx(){
  var ws=getWS(state.weekOff);
  var lines=['Week: '+fd(ws)];
  state.employees.forEach(function(emp){
    var days=[];
    for(var d=0;d<7;d++){var s=state.schedule[ekey(emp.name,d)]||'';days.push(DAYS[d]+':'+(s?SNAMES[s]:'brak'))}
    lines.push(emp.name+'(pref:'+emp.pref+'): '+days.join(', '));
  });
  return lines.join('\n');
}

async function sendMsg(){
  var inp=document.getElementById('chat-in');
  var txt=inp.value.trim();
  if(!txt||aiLoading)return;
  inp.value='';inp.style.height='auto';
  aiLoading=true;
  addBubble('user',txt);
  var typing=addBubble('ai','<div class="typing-bubble"><span></span><span></span><span></span></div>');

  var sys='You are a work schedule planning assistant for a small electrical company PG.\n'+
    'Masz dostęp do grafiku:\n'+getCtx()+'\n\n'+
    'Zasady:\n'+
    '1. When someone is sick/absent – suggest a specific replacement with reasoning (workload, shift preference, days off this week).\n'+
    '2. Be concise – max 4 sentences. Use names. No long lists.\n'+
    '3. You can suggest changes in format [ACTION:{"emp":"Jan Kowalski","day":2,"shift":"A","label":"Assign Jan Wednesday A"}]\n'+
    '4. Reply in English. Tone: direct, like a good foreman.\n'+
    '5. If someone asks about optimization – check who has too many/few shifts.';

  var msgs=chatHistory.concat([{role:'user',content:txt}]);
  try{
    var r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,system:sys,messages:msgs})
    });
    var data=await r.json();
    var aiText=data.content&&data.content[0]?data.content[0].text:'Error.';
    chatHistory.push({role:'user',content:txt});
    chatHistory.push({role:'assistant',content:aiText});
    if(chatHistory.length>12)chatHistory=chatHistory.slice(-12);

    var actions=[];
    var cleaned=aiText.replace(/\[ACTION:(\{[^\}]+\})\]/g,function(_,j){try{actions.push(JSON.parse(j))}catch(e){}return ''});
    var fmted=cleaned.trim().replace(/\*\*(.*?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
    var html=fmted;
    if(actions.length){
      html+='<div class="action-chips">';
      actions.forEach(function(a){
        var safe=a.emp.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
        html+='<div class="chip" onclick="applyAction(\''+safe+'\','+a.day+',\''+a.shift+'\')">'+a.label+'</div>';
      });
      html+='</div>';
    }
    typing.innerHTML=html;
  }catch(e){typing.innerHTML='Connection error.'}
  document.getElementById('chat-msgs').scrollTop=99999;
  aiLoading=false;
}

function applyAction(emp,day,shift){
  state.schedule[ekey(emp,day)]=shift;
  save();render();
  addBubble('ai','<b>Done</b> — shift updated in the schedule.');
}

addBubble('ai','Hi! Describe the scheduling problem, e.g. <b>"Smith is sick on Wednesday morning"</b> — I\'ll suggest the best replacement.');

render();

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
</body>
</html>
